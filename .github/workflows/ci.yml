# Validates pull requests with the SAME checks the deploy job runs, so a green
# PR means a green deploy. Without this nothing gates a merge into main — and
# main deploys straight to amkaz.dev.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets CI be re-run by hand from the Actions tab. Useful when a run never
  # fired for a commit — which happens if a branch is force-pushed before its
  # pull request is opened, leaving the PR with no status at all.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Catches in-page links pointing at renamed/removed section ids.
      # TypeScript cannot see these — they are plain strings.
      - run: npm run check:anchors
      # Same command as the deploy workflow's build step (tsc -b && vite build)
      - run: npm run build
      # Metadata has no visible failure mode in a browser — the site shipped a
      # `summary_large_image` card with no image for weeks. Checked against the
      # BUILT output, since that is what crawlers receive.
      - run: npm run check:meta
